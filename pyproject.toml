[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cl-sam-replication"
version = "0.1.0"
description = "Configuration-driven replication tooling around an immutable CA-SAM baseline"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.25",
  "Pillow>=10",
  "PyYAML>=6",
  "scipy>=1.11",
]

[project.optional-dependencies]
analysis = ["matplotlib>=3.8", "pandas>=2.0", "scikit-learn>=1.3", "seaborn>=0.13"]
test = ["pytest>=8"]

[project.scripts]
cl-sam-prepare = "cl_sam_replication.prepare:main"
cl-sam-train = "cl_sam_replication.runner:main"
cl-sam-plots = "cl_sam_replication.history:main"
cl-sam-latents = "cl_sam_replication.latent_analysis:main"
cl-sam-extract-latents = "cl_sam_replication.extract_latents:main"
cl-sam-validate = "cl_sam_replication.validate:main"
cl-sam-smoke = "cl_sam_replication.smoke:main"
cl-sam-evaluate = "cl_sam_replication.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
