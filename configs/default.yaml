experiment:
  name: five_task_public_2d
  seed: 42

paths:
  prepared_data_root: /content/ca_sam_official_data
  sam_checkpoint: /content/pretrain_model/sam_vit_b_01ec64.pth
  output_root: /content/drive/MyDrive/CA_SAM/CL_SAM_runs/five_task_default

training:
  device: cuda:0
  model_type: vit_b
  method: cnn
  num_cnn: 3
  epochs: 24
  learning_rate: 0.0001
  train_batch_size: 1
  eval_batch_size: 1
  num_workers: 2
  image_size: 1024
  mask_num: 5
  multimask: false

router:
  type: vae
  threshold: 1.0
  zero_adapter_mode: identity
  feature: attn_pool
  input_dimension: 256
  latent_dimension: 64
  beta: 16.5
  epochs: 10
  learning_rate: 0.0005
  k_folds: 5
  fold_seed: 2025

analysis:
  max_samples_per_task: 500
  tsne_perplexity: 30
  tsne_seed: 42
  save_embeddings: true

evaluation:
  qualitative_samples_per_task: 10
